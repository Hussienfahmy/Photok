name: Test APK

# Temporary workflow for the fork: builds a FOSS debug APK of the media filter
# branch and uploads it as a workflow artifact for testing on a phone.

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photok-filter-test-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 7
      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest --no-daemon
